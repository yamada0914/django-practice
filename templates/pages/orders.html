{% extends 'base.html' %}

{% block main %}
<div class="container mx-auto px-4 py-8">
  <div class="max-w-5xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">注文履歴</h1>

    {% if object_list %}
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                注文番号</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                注文日時</th>
              <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                支払金額（税込）</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            {% for object in object_list %}
            <tr class="hover:bg-gray-50">
              <td class="px-6 py-4 whitespace-nowrap">
                <a href="/orders/{{object.pk}}/" class="text-primary-500 hover:text-primary-600 font-medium">
                  #{{object.pk}}
                </a>
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-800">
                {{object.created_at|date:"Y年m月d日 H:i"}}
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-800 text-right">
                ¥{{object.tax_included}}
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
    {% else %}
    <div class="bg-white rounded-xl shadow-sm p-8 text-center">
      <p class="text-gray-600">注文履歴がありません。</p>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}

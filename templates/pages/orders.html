{% extends 'base.html' %} {% block main %}
<div class="container mx-auto px-4 py-8">
  <div class="mx-auto max-w-5xl">
    <h1 class="mb-6 text-2xl font-bold text-gray-800">注文履歴</h1>

    {% if object_list %}
    <div class="overflow-hidden rounded-xl bg-white shadow-sm">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="border-b border-gray-200 bg-gray-50">
            <tr>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
                注文番号
              </th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
                注文日時
              </th>
              <th scope="col" class="px-6 py-3 text-right text-xs font-medium uppercase tracking-wider text-gray-500">
                支払金額（税込）
              </th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            {% for object in object_list %}
            <tr class="hover:bg-gray-50">
              <td class="whitespace-nowrap px-6 py-4">
                <a href="/orders/{{object.pk}}/" class="text-primary-500 hover:text-primary-600 font-medium">
                  #{{object.pk}}
                </a>
              </td>
              <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-800">
                {{object.created_at|date:"Y年m月d日 H:i"}}
              </td>
              <td class="whitespace-nowrap px-6 py-4 text-right text-sm text-gray-800">
                ¥{{object.tax_included}}
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
    {% else %}
    <div class="rounded-xl bg-white p-8 text-center shadow-sm">
      <p class="text-gray-600">注文履歴がありません。</p>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}

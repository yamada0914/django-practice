{% extends 'base.html' %}
{% block main %}

<!-- メインバナー画像 -->
<div class="container mx-auto px-4 mb-8 flex justify-center">
  <div x-data="{
      images: [
        'https://hareruya2-filepool.s3.us-east-1.amazonaws.com/banner/topslide/250508_DeckPartsCorner.webp',
        'https://hareruya2-filepool.s3.amazonaws.com/banner/webp/topslide/banner_2401_stn.webp',
        'https://hareruya2-filepool.s3.us-east-1.amazonaws.com/banner/topslide/banner_2308_ec_kixyuuzin.jpg',
        'https://hareruya2-filepool.s3.us-east-1.amazonaws.com/banner/topslide/2503_appraised.webp'
      ],
      current: 0,
      timer: null,
      next() { this.current = (this.current + 1) % this.images.length },
      prev() { this.current = (this.current - 1 + this.images.length) % this.images.length },
      start() { this.timer = setInterval(() => { this.next() }, 5000) },
      stop() { clearInterval(this.timer); this.timer = null; }
    }" x-init="start()" class="relative w-[800px] h-[450px] flex items-center justify-center">
    <img :src="images[current]" alt="バナー" class="w-full h-full object-cover object-center" />
    <!-- 左矢印 -->
    <button @click="prev();"
      class="absolute left-2 top-1/2 -translate-y-1/2 bg-transparent hover:bg-white/20 rounded-full w-12 h-12 flex items-center justify-center"
      aria-label="前へ">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="white"
        stroke-width="4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </button>
    <!-- 右矢印 -->
    <button @click="next();"
      class="absolute right-2 top-1/2 -translate-y-1/2 bg-transparent hover:bg-white/20 rounded-full w-12 h-12 flex items-center justify-center"
      aria-label="次へ">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="white"
        stroke-width="4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    </button>
    <!-- インジケーター -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex space-x-2">
      <template x-for="(_, idx) in images" :key="idx">
        <span :class="{'bg-black': current === idx, 'bg-white': current !== idx}"
          class="block w-12 h-2 transition-all opacity-50"></span>
      </template>
    </div>
  </div>
</div>

<!-- メインバナー下 2カラム -->
<div class="container mx-auto px-4 flex flex-col lg:flex-row gap-5 my-8">
  <!-- サイドバー -->
  {% include 'snippets/sidebar.html' %}

  <!-- メイン -->
  <main class="flex-1">
    <div class="bg-white relative mb-6">
      <!-- 特集バナー -->
      <div class="flex">
        <a href="#"
          class="border-2 border-red-500 px-6 py-2 font-bold text-red-500 flex items-center bg-white block w-full">
          <span class="ml-auto">✨キラキラ✨ミラー特集開催中！！</span>
          <span class="ml-auto text-2xl">&gt;</span>
        </a>
      </div>
      <!-- タイトル -->
      <div class="flex items-center mb-6 mt-6">
        <div class="w-1 h-11 bg-red-500 mr-3"></div>
        <h2 class="">新着商品販売中!!</h2>
      </div>
      <!-- スライダー -->
      <div x-data='{
          slides: [
            {% for group in POPULAR_GROUPS %}
              [
                {% for item in group %}
                  {
                    name: "{{ item.name|escapejs }}",
                    pk: "{{ item.pk }}",
                    image: "{{ item.image.url|default:'' }}",
                    price: {{ item.price|default:0 }},
                    stock: {{ item.stock|default:0 }}
                  }{% if not forloop.last %},{% endif %}
                {% endfor %}
              ]{% if not forloop.last %},{% endif %}
            {% endfor %}
          ],
          current: 0,
          next() { this.current = (this.current + 1) % this.slides.length },
          prev() { this.current = (this.current - 1 + this.slides.length) % this.slides.length }
        }' class="relative px-6 h-96">
        <!-- スライド本体 -->
        <div class="flex justify-center items-end">
          <template x-for="item in slides[current]" :key="item.name">
            <div class="basis-1/3 px-4 text-center">
              <a :href="`/products/${item.pk}/`">
                <img :src="item.image" alt="" class="w-36 mb-2 rounded bg-white object-contain mx-auto" />
              </a>
              <div class="font-bold text-red-600 text-base mt-2" x-text="item.name"></div>
              <div class="font-bold text-2xl mt-1" x-text="'¥' + item.price.toLocaleString()"></div>
              <div class="text-sm text-gray-600" x-text="'在庫' + item.stock"></div>
            </div>
          </template>
        </div>
        <!-- 左矢印 -->
        <button @click="prev()"
          class="h-full absolute left-2 top-1/2 -translate-y-1/2 bg-opacity-80 w-8 flex items-center justify-center text-2xl text-red-500 shadow border border-gray-300 bg-gray-100"
          aria-label="前へ">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <!-- 右矢印 -->
        <button @click="next()"
          class="h-full absolute right-2 top-1/2 -translate-y-1/2 w-8 flex items-center justify-center text-2xl text-red-500 shadow border bg-gray-100"
          aria-label="次へ">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>
        <!-- インジケーター -->
        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex space-x-4">
          <template x-for="(group, idx) in slides" :key="idx">
            <span :class="{'bg-red-500': current === idx, 'border-2': current !== idx}"
              class="block w-3 h-3 rounded-full"></span>
          </template>
        </div>
      </div>
      <div class="border-b-2 border-gray-200 mt-1 mb-6"></div>
    </div>



    <!-- もっと見る -->
    <div class="flex justify-end mt-4 mb-6">
      <a href="#" class="text-xs text-red-500 border px-1 py-1 rounded hover:bg-red-50 flex items-center">
        もっと見る
        <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </a>
    </div>

    <!-- 特集・バナー -->
    <div>
      <ul class="flex flex-wrap">
        {% for banner in BANNERS %}
        <li class="w-1/2 px-2 pb-5">
          <a class="h-full w-full" href="{{ banner.url }}"><img src="{{ banner.img }}""
              class=" h-full w-full object-cover" /></a>
        </li>
        {% endfor %}
      </ul>
    </div>

    <div class="flex items-center mb-6 mt-6">
      <div class="w-1 h-11 bg-red-500 mr-3"></div>
      <h2 class="">値下げしました!</h2>
    </div>

    <div class="mb-7">
      <a class="h-full w-full" href="#"><img
          src="https://hareruya2-filepool.s3.amazonaws.com/banner/webp/1column/img_1810_tyokougakucard01.webp"
          class=" h-full w-full object-cover" /></a>
    </div>
    <div class="mb-7">
      <a class="h-full w-full" href="#"><img
          src="https://hareruya2-filepool.s3.amazonaws.com/banner/webp/1column/img_2303_legendhp.webp"
          class=" h-full w-full object-cover" /></a>
    </div>
    <div class="mb-7">
      <a class="h-full w-full" href="#"><img
          src="https://hareruya2-filepool.s3.us-east-1.amazonaws.com/banner/1column/img_2503_basicenergy.webp"
          class=" h-full w-full object-cover" /></a>
    </div>
    <div class="mb-7">
      <div class="grid grid-cols-4 gap-4">
        {% for img in FOUR_BANNERS %}
        <a href="{{ img.url }}" class="block">
          <img src="{{ img.src }}" class="w-full h-full object-cover" />
        </a>
        {% endfor %}
      </div>
    </div>


    <div class="mb-7">
      <a class="h-full w-full" href="#"><img
          src="https://hareruya2-filepool.s3.amazonaws.com/banner/webp/1column/img_2303_hareruya2_recruit.webp"
          class=" h-full w-full object-cover" /></a>
    </div>

    <div class="flex items-center mb-6 mt-6">
      <div class="w-1 h-11 bg-red-500 mr-3"></div>
      <h2 class="">系列店舗はこちら</h2>
    </div>

    <div class="mb-7">
      <a class="h-full w-full" href="https://www.hareruyamtg.com/"><img
          src="https://hareruya2-filepool.s3.amazonaws.com/banner/webp/1column/img_2107_hareruya.webp"
          class=" h-full w-full object-cover" /></a>
    </div>
    <div class="mb-7">
      <a class="h-full w-full" href="https://www.hareruya3.com/"><img
          src="https://hareruya2-filepool.s3.amazonaws.com/banner/webp/1column/img_2409_hareruya3.webp"
          class=" h-full w-full object-cover" /></a>
    </div>

    <div class="flex items-center mb-6 mt-6">
      <div class="w-1 h-11 bg-red-500 mr-3"></div>
      <h2 class="">最近チェックした商品</h2>
    </div>


  </main>
</div>
{% endblock %}

{% extends 'base.html' %} {% block main %}
<div class="container mx-auto px-4 py-8">
  <div class="max-w-3xl mx-auto">
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <div class="p-6 sm:p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">アカウント設定</h2>

        <form method="POST" class="space-y-8">
          {% csrf_token %}

          <!-- アカウント基本情報 -->
          <div class="space-y-4">
            <h3
              class="text-lg font-semibold text-gray-800 pb-2 border-b border-gray-200"
            >
              基本情報
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label
                  for="username"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >ユーザー名</label
                >
                <input
                  type="text"
                  id="username"
                  name="username"
                  value="{{user.username}}"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                  required
                />
              </div>
              <div>
                <label
                  for="email"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >メールアドレス</label
                >
                <input
                  type="email"
                  id="email"
                  name="email"
                  value="{{user.email}}"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                  required
                />
              </div>
            </div>
          </div>

          <!-- 配送先情報 -->
          <div class="space-y-4">
            <h3
              class="text-lg font-semibold text-gray-800 pb-2 border-b border-gray-200"
            >
              配送先情報
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="md:col-span-2">
                <label
                  for="name"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >氏名</label
                >
                <input
                  type="text"
                  id="name"
                  name="name"
                  value="{{user.profile.name}}"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                />
              </div>
              <div>
                <label
                  for="zipcode"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >郵便番号</label
                >
                <input
                  type="text"
                  id="zipcode"
                  name="zipcode"
                  value="{{user.profile.zipcode}}"
                  placeholder="123-4567"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                />
              </div>
              <div>
                <label
                  for="prefecture"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >都道府県</label
                >
                <input
                  type="text"
                  id="prefecture"
                  name="prefecture"
                  value="{{user.profile.prefecture}}"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                />
              </div>
              <div>
                <label
                  for="city"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >市区町村</label
                >
                <input
                  type="text"
                  id="city"
                  name="city"
                  value="{{user.profile.city}}"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                />
              </div>
              <div>
                <label
                  for="address1"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >住所1（町名・番地）</label
                >
                <input
                  type="text"
                  id="address1"
                  name="address1"
                  value="{{user.profile.address1}}"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                />
              </div>
              <div>
                <label
                  for="address2"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >住所2（建物名・部屋番号）</label
                >
                <input
                  type="text"
                  id="address2"
                  name="address2"
                  value="{{user.profile.address2}}"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                />
              </div>
              <div>
                <label
                  for="tel"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >電話番号</label
                >
                <input
                  type="tel"
                  id="tel"
                  name="tel"
                  value="{{user.profile.tel}}"
                  placeholder="090-1234-5678"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                />
              </div>
            </div>
          </div>

          <div>
            <button
              type="submit"
              class="w-full md:w-auto px-8 py-3 bg-primary-500 hover:bg-primary-600 text-white font-medium rounded-lg transition-colors"
            >
              変更を保存
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block main %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="card-title fw-bold mb-4">アカウント設定</h2>

          <form method="POST">
            {% csrf_token %}

            <!-- アカウント基本情報 -->
            <div class="mb-4">
              <h5 class="mb-3 border-bottom pb-2">基本情報</h5>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="username" class="form-label">ユーザー名</label>
                  <input type="text" class="form-control" id="username" name="username" value="{{user.username}}"
                    required>
                </div>
                <div class="col-md-6">
                  <label for="email" class="form-label">メールアドレス</label>
                  <input type="email" class="form-control" id="email" name="email" value="{{user.email}}" required>
                </div>
              </div>
            </div>

            <!-- 配送先情報 -->
            <div class="mb-4">
              <h5 class="mb-3 border-bottom pb-2">配送先情報</h5>
              <div class="row g-3">
                <div class="col-12">
                  <label for="name" class="form-label">氏名</label>
                  <input type="text" class="form-control" id="name" name="name" value="{{user.profile.name}}">
                </div>
                <div class="col-md-4">
                  <label for="zipcode" class="form-label">郵便番号</label>
                  <input type="text" class="form-control" id="zipcode" name="zipcode" value="{{user.profile.zipcode}}"
                    placeholder="123-4567">
                </div>
                <div class="col-md-4">
                  <label for="prefecture" class="form-label">都道府県</label>
                  <input type="text" class="form-control" id="prefecture" name="prefecture"
                    value="{{user.profile.prefecture}}">
                </div>
                <div class="col-md-4">
                  <label for="city" class="form-label">市区町村</label>
                  <input type="text" class="form-control" id="city" name="city" value="{{user.profile.city}}">
                </div>
                <div class="col-md-6">
                  <label for="address1" class="form-label">住所1（町名・番地）</label>
                  <input type="text" class="form-control" id="address1" name="address1"
                    value="{{user.profile.address1}}">
                </div>
                <div class="col-md-6">
                  <label for="address2" class="form-label">住所2（建物名・部屋番号）</label>
                  <input type="text" class="form-control" id="address2" name="address2"
                    value="{{user.profile.address2}}">
                </div>
                <div class="col-md-6">
                  <label for="tel" class="form-label">電話番号</label>
                  <input type="tel" class="form-control" id="tel" name="tel" value="{{user.profile.tel}}"
                    placeholder="090-1234-5678">
                </div>
              </div>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary btn-lg">変更を保存</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .card {
    border: none;
    border-radius: 15px;
  }

  .form-control {
    border-radius: 8px;
    padding: 0.75rem 1rem;
  }

  .form-control:focus {
    border-color: #4dabf7;
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1);
  }

  .btn-primary {
    padding: 0.8rem 2rem;
    font-weight: 600;
    border-radius: 8px;
  }
</style>
{% endblock %}

{% extends 'base.html' %} {% block main %}
<div class="container mx-auto px-4 py-8">
  <div class="mx-auto max-w-3xl">
    <div class="overflow-hidden rounded-xl bg-white shadow-sm">
      <div class="p-6 sm:p-8">
        <h2 class="mb-6 text-2xl font-bold text-gray-800">アカウント設定</h2>

        <form method="POST" class="space-y-8">
          {% csrf_token %}

          <!-- アカウント基本情報 -->
          <div class="space-y-4">
            <h3 class="border-b border-gray-200 pb-2 text-lg font-semibold text-gray-800">
              基本情報
            </h3>
            <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
              <div>
                <label for="username" class="mb-1 block text-sm font-medium text-gray-700">ユーザー名</label>
                <input type="text" id="username" name="username" value="{{user.username}}"
                  class="focus:ring-primary-500 focus:border-primary-500 w-full rounded-lg border border-gray-300 px-4 py-2 transition-colors focus:ring-2"
                  required />
              </div>
              <div>
                <label for="email" class="mb-1 block text-sm font-medium text-gray-700">メールアドレス</label>
                <input type="email" id="email" name="email" value="{{user.email}}"
                  class="focus:ring-primary-500 focus:border-primary-500 w-full rounded-lg border border-gray-300 px-4 py-2 transition-colors focus:ring-2"
                  required />
              </div>
            </div>
          </div>

          <!-- 配送先情報 -->
          <div class="space-y-4">
            <h3 class="border-b border-gray-200 pb-2 text-lg font-semibold text-gray-800">
              配送先情報
            </h3>
            <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
              <div class="md:col-span-2">
                <label for="name" class="mb-1 block text-sm font-medium text-gray-700">氏名</label>
                <input type="text" id="name" name="name" value="{{user.profile.name}}"
                  class="focus:ring-primary-500 focus:border-primary-500 w-full rounded-lg border border-gray-300 px-4 py-2 transition-colors focus:ring-2" />
              </div>
              <div>
                <label for="zipcode" class="mb-1 block text-sm font-medium text-gray-700">郵便番号</label>
                <input type="text" id="zipcode" name="zipcode" value="{{user.profile.zipcode}}" placeholder="123-4567"
                  class="focus:ring-primary-500 focus:border-primary-500 w-full rounded-lg border border-gray-300 px-4 py-2 transition-colors focus:ring-2" />
              </div>
              <div>
                <label for="prefecture" class="mb-1 block text-sm font-medium text-gray-700">都道府県</label>
                <input type="text" id="prefecture" name="prefecture" value="{{user.profile.prefecture}}"
                  class="focus:ring-primary-500 focus:border-primary-500 w-full rounded-lg border border-gray-300 px-4 py-2 transition-colors focus:ring-2" />
              </div>
              <div>
                <label for="city" class="mb-1 block text-sm font-medium text-gray-700">市区町村</label>
                <input type="text" id="city" name="city" value="{{user.profile.city}}"
                  class="focus:ring-primary-500 focus:border-primary-500 w-full rounded-lg border border-gray-300 px-4 py-2 transition-colors focus:ring-2" />
              </div>
              <div>
                <label for="address1" class="mb-1 block text-sm font-medium text-gray-700">住所1（町名・番地）</label>
                <input type="text" id="address1" name="address1" value="{{user.profile.address1}}"
                  class="focus:ring-primary-500 focus:border-primary-500 w-full rounded-lg border border-gray-300 px-4 py-2 transition-colors focus:ring-2" />
              </div>
              <div>
                <label for="address2" class="mb-1 block text-sm font-medium text-gray-700">住所2（建物名・部屋番号）</label>
                <input type="text" id="address2" name="address2" value="{{user.profile.address2}}"
                  class="focus:ring-primary-500 focus:border-primary-500 w-full rounded-lg border border-gray-300 px-4 py-2 transition-colors focus:ring-2" />
              </div>
              <div>
                <label for="tel" class="mb-1 block text-sm font-medium text-gray-700">電話番号</label>
                <input type="tel" id="tel" name="tel" value="{{user.profile.tel}}" placeholder="090-1234-5678"
                  class="focus:ring-primary-500 focus:border-primary-500 w-full rounded-lg border border-gray-300 px-4 py-2 transition-colors focus:ring-2" />
              </div>
            </div>
          </div>

          <div>
            <button type="submit"
              class="bg-primary-500 hover:bg-primary-600 w-full rounded-lg px-8 py-3 font-medium text-white transition-colors md:w-auto">
              変更を保存
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

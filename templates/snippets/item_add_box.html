<div class="overflow-hidden rounded-lg border border-gray-200">
  <img src="{{ object.image.url }}" class="w-full bg-white object-contain" width="50%" alt="{{object.name}}" />
  <div class="bg-gray-50 p-4">
    <h2 class="mb-4 text-lg text-gray-600">
      {{object.name}} - ¥{{object.price}}
    </h2>
    <form action="/cart/add/" method="POST">
      {% csrf_token %}
      <input type="hidden" name="item_pk" value="{{object.pk}}" />
      <div class="flex flex-col gap-3 sm:flex-row">
        <div class="flex-grow">
          <input type="number"
            class="focus:ring-primary-500 focus:border-primary-500 w-full rounded-lg border border-gray-300 px-3 py-2 transition-colors focus:ring-2"
            name="quantity" value="1" max="{{object.stock}}" />
        </div>
        <div class="flex-shrink-0">
          {% if object.stock == 0 %}
          <button type="submit"
            class="w-full cursor-not-allowed rounded-lg bg-yellow-100 px-6 py-2 text-yellow-800 opacity-75 sm:w-auto"
            disabled>
            売り切れ
          </button>
          {% else %}
          <button type="submit"
            class="bg-primary-500 hover:bg-primary-600 w-full rounded-lg px-6 py-2 text-white transition-colors sm:w-auto">
            カートに追加
          </button>
          {% endif %}
        </div>
      </div>
    </form>
  </div>
</div>

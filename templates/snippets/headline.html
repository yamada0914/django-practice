<div class="relative overflow-hidden bg-gradient-to-br from-gray-50 to-gray-100">
  <div class="container mx-auto px-4">
    <div class="min-h-[50vh] flex items-center py-12">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-center">
        <!-- テキストセクション -->
        <div class="text-center lg:text-left">
          <h1
            class="text-4xl md:text-5xl font-bold mb-6 bg-gradient-to-r from-primary-500 to-cyan-500 bg-clip-text text-transparent">
            {{ TITLE }}
          </h1>
          <p class="text-lg text-gray-600 leading-relaxed">
            ポケモンカードの取引を、より安全に、より便利に。<br>
            信頼できる取引プラットフォームで、あなたの大切なカードを売買しましょう。
          </p>
        </div>

        <!-- カードアニメーション -->
        <div class="hidden lg:block relative h-[400px]">
          <div class="relative h-full group">
            <!-- カード1 -->
            <div class="absolute w-48 h-64 rounded-xl bg-gradient-to-br from-red-400 to-pink-500 shadow-lg
                       top-[20%] left-[10%] -rotate-15 z-30
                       transition-transform duration-300 group-hover:-rotate-[20deg] group-hover:-translate-y-2">
            </div>
            <!-- カード2 -->
            <div class="absolute w-48 h-64 rounded-xl bg-gradient-to-br from-blue-400 to-primary-500 shadow-lg
                       top-[10%] left-[30%] rotate-5 z-20
                       transition-transform duration-300 group-hover:rotate-10 group-hover:-translate-y-1">
            </div>
            <!-- カード3 -->
            <div class="absolute w-48 h-64 rounded-xl bg-gradient-to-br from-green-400 to-green-600 shadow-lg
                       top-[30%] left-[20%] -rotate-5 z-10
                       transition-transform duration-300 group-hover:-rotate-10 group-hover:-translate-y-2">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

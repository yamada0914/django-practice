<div class="relative overflow-hidden bg-gradient-to-br from-gray-50 to-gray-100">
  <div class="container mx-auto px-4">
    <div class="flex min-h-[50vh] items-center py-12">
      <div class="grid grid-cols-1 items-center gap-8 lg:grid-cols-2">
        <!-- テキストセクション -->
        <div class="text-center lg:text-left">
          <h1
            class="from-primary-500 mb-6 bg-gradient-to-r to-cyan-500 bg-clip-text text-4xl font-bold text-transparent md:text-5xl">
            {{ TITLE }}
          </h1>
          <p class="text-lg leading-relaxed text-gray-600">
            ポケモンカードの取引を、より安全に、より便利に。<br />
            信頼できる取引プラットフォームで、あなたの大切なカードを売買しましょう。
          </p>
        </div>

        <!-- カードアニメーション -->
        <div class="relative hidden h-[400px] lg:block">
          <div class="group relative h-full">
            <!-- カード1 -->
            <div
              class="-rotate-15 absolute left-[10%] top-[20%] z-30 h-64 w-48 rounded-xl bg-gradient-to-br from-red-400 to-pink-500 shadow-lg transition-transform duration-300 group-hover:-translate-y-2 group-hover:-rotate-[20deg]">
            </div>
            <!-- カード2 -->
            <div
              class="to-primary-500 rotate-5 group-hover:rotate-10 absolute left-[30%] top-[10%] z-20 h-64 w-48 rounded-xl bg-gradient-to-br from-blue-400 shadow-lg transition-transform duration-300 group-hover:-translate-y-1">
            </div>
            <!-- カード3 -->
            <div
              class="-rotate-5 group-hover:-rotate-10 absolute left-[20%] top-[30%] z-10 h-64 w-48 rounded-xl bg-gradient-to-br from-green-400 to-green-600 shadow-lg transition-transform duration-300 group-hover:-translate-y-2">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<a href="/items/{{object.pk}}/" class="block group">
  <div
    class="h-full bg-white rounded-md overflow-hidden shadow-sm transition-all duration-200 transform group-hover:-translate-y-1 group-hover:shadow-lg"
  >
    <div class="relative pt-[60%] bg-gray-50">
      <img
        src="/{{object.image}}"
        class="absolute inset-0 w-full h-full object-contain p-1.5"
        alt="{{object.name}}"
      />
    </div>
    <div class="p-2">
      <h5 class="text-gray-800 text-xs leading-tight mb-1 line-clamp-2">
        {{object.name}}
      </h5>
      <p class="text-primary-500 font-bold text-sm">¥{{object.price}}</p>
    </div>
  </div>
</a>

{% comment %}
スライダーコンポーネント
使用方法: {% include 'snippets/slider.html' with title="タイトル" slides_data=SLIDES_DATA %}
{% endcomment %}

<div x-data='{
  slides: {{ slides_data|safe }},
  current: 0,
  next() { this.current = (this.current + 1) % this.slides.length },
  prev() { this.current = (this.current - 1 + this.slides.length) % this.slides.length }
}' class="relative h-[440px]">
    {% if title %}
    <div class="mt-4 mb-2">{{ title }}</div>
    {% endif %}

    <!-- スライダー本体 -->
    <div class="flex h-96 w-full">
        <!-- 左矢印 -->
        <div @click="current !== 0 ? prev() : null"
            :class="{'opacity-50 cursor-not-allowed': current === 0, 'cursor-pointer': current !== 0}"
            class="h-full bg-opacity-80 w-8 flex items-center justify-center text-2xl text-red-500 shadow border bg-[#f5f5f5] bg-[url('https://hareruya2-filepool.s3.amazonaws.com/icon/icon_prev.gif')] bg-center bg-[length:25px_25px] bg-no-repeat"
            aria-label="前へ">
        </div>

        <!-- スライド本体 -->
        <div class="pt-1">
            <div class="flex justify-center">
                <template x-for="item in slides[current]" :key="item.name">
                    <div class="basis-1/3 px-4">
                        <a :href="`/products/${item.pk}/`">
                            <img :src="item.image" alt=""
                                class="w-36 mb-2 rounded bg-white object-contain mx-auto hover:opacity-80 transition-all duration-200" />
                        </a>
                        <div class="font-bold text-red-600 mt-2 text-sm" x-text="item.name"></div>
                        <div class="font-bold mt-1" x-text="'¥' + item.price.toLocaleString()"></div>
                        <div class="text-xs text-gray-600" x-text="'在庫' + item.stock"></div>
                    </div>
                </template>
            </div>

            <!-- インジケーター -->
            <div class="flex space-x-4 items-center justify-center mt-10">
                <template x-for="(group, idx) in slides" :key="idx">
                    <span :class="{'bg-red-500': current === idx, 'border-2': current !== idx}"
                        class="block w-3 h-3 rounded-full"></span>
                </template>
            </div>
        </div>

        <!-- 右矢印 -->
        <div @click="current !== slides.length - 1 ? next() : null"
            :class="{'opacity-50 cursor-not-allowed': current === slides.length - 1, 'cursor-pointer': current !== slides.length - 1}"
            class="h-full w-8 flex items-center justify-center text-2xl text-red-500 shadow border bg-[#f5f5f5] bg-[url('https://hareruya2-filepool.s3.amazonaws.com/icon/icon_next.gif')] bg-center bg-[length:25px_25px] bg-no-repeat"
            aria-label="次へ">
        </div>
    </div>
</div>

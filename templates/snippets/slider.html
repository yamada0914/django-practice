{% comment %}
スライダーコンポーネント
使用方法: {% include 'snippets/slider.html' with title="タイトル" slides_data=SLIDES_DATA %}
{% endcomment %}

<div class="relative h-[440px]" data-slides='{{ slides_data|safe }}' x-data="{
       slides: JSON.parse($el.dataset.slides || '[]'),
       current: 0,
       next() { 
         if (this.slides && this.slides.length > 0) {
           this.current = (this.current + 1) % this.slides.length;
         }
       },
       prev() { 
         if (this.slides && this.slides.length > 0) {
           this.current = (this.current - 1 + this.slides.length) % this.slides.length;
         }
       }
     }">
    {% if title %}
    <div class="mb-2 mt-4">{{ title }}</div>
    {% endif %}

    <!-- スライダー本体 -->
    <div class="flex h-96 w-full">
        <!-- 左矢印 -->
        <div @click="current !== 0 ? prev() : null"
            :class="{' opacity-50 cursor-not-allowed': current===0, 'cursor-pointer' : current !==0}"
            class="flex h-full w-8 items-center justify-center border bg-[#f5f5f5] bg-opacity-80 bg-[url('https://hareruya2-filepool.s3.amazonaws.com/icon/icon_prev.gif')] bg-[length:25px_25px] bg-center bg-no-repeat text-2xl text-red-500 shadow"
            aria-label="前へ"></div>

        <!-- スライド本体 -->
        <div class="pt-1">
            <div class="flex justify-center">
                <template x-for="item in slides[current]" :key="item.name">
                    <div class="basis-1/3 px-4">
                        <a :href="`/products/${item.pk}/`" class="block">
                            <img :src="item.image" alt=""
                                class="mx-auto mb-2 w-36 rounded bg-white object-contain transition-all duration-200 hover:opacity-80" />
                            <div class="mt-2 text-sm font-bold text-red-600" x-text="item.name"></div>
                            <div class="mt-1 font-bold" x-text="'¥' + item.price.toLocaleString()"></div>
                            <div class="text-xs text-gray-600" x-text="'在庫' + item.stock"></div>
                        </a>
                    </div>
                </template>
            </div>

            <!-- インジケーター -->
            <div class="mt-10 flex items-center justify-center space-x-4">
                <template x-for="(group, idx) in slides" :key="idx">
                    <span :class="{'bg-red-500': current === idx, 'border-2': current !== idx}"
                        class="block h-3 w-3 rounded-full"></span>
                </template>
            </div>
        </div>

        <!-- 右矢印 -->
        <div @click="current !== slides.length - 1 ? next() : null"
            :class="{'opacity-50 cursor-not-allowed': current === slides.length - 1, 'cursor-pointer': current !== slides.length - 1}"
            class="flex h-full w-8 items-center justify-center border bg-[#f5f5f5] bg-[url('https://hareruya2-filepool.s3.amazonaws.com/icon/icon_next.gif')] bg-[length:25px_25px] bg-center bg-no-repeat text-2xl text-red-500 shadow"
            aria-label="次へ"></div>
    </div>
</div>

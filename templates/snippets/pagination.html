<nav class="mt-8 flex justify-center">
  <ul class="flex items-center space-x-1">
    {% if page_obj.has_previous %}
    <li>
      <a href="?page={{ page_obj.previous_page_number }}"
        class="flex items-center rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-600 transition-colors hover:bg-gray-50">
        <i class="fas fa-chevron-left mr-1 text-sm"></i>
        前へ
      </a>
    </li>
    {% endif %} {% for num in page_obj.paginator.page_range %} {% if page_obj.number == num %}
    <li>
      <a href="#" class="bg-primary-500 border-primary-500 rounded-lg border px-4 py-2 text-white">
        {{ num }}
      </a>
    </li>
    {% else %}
    <li>
      <a href="?page={{ num }}"
        class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-600 transition-colors hover:bg-gray-50">
        {{ num }}
      </a>
    </li>
    {% endif %} {% endfor %} {% if page_obj.has_next %}
    <li>
      <a href="?page={{ page_obj.next_page_number }}"
        class="flex items-center rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-600 transition-colors hover:bg-gray-50">
        次へ
        <i class="fas fa-chevron-right ml-1 text-sm"></i>
      </a>
    </li>
    {% endif %}
  </ul>
</nav>
